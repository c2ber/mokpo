<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 맛집 지도</title>
  <meta name="description" content="직접 먹어보고 기억해두고 싶은 맛집 모음">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<main class="container">

  <header class="header">
    <h1>🍴 나의 맛집 지도</h1>
    <p>먹어보고 기억해두고 싶은 곳들</p>
  </header>

  <nav id="categories" class="categories"></nav>

  <div class="search-area">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="상호명, 메뉴, 코멘트를 검색해보세요" autocomplete="off">
  </div>

  <div class="info">
    <span id="resultCount"></span>
    <span id="lastUpdate"></span>
  </div>

  <section id="restaurantList" class="restaurant-list"></section>

  <div id="emptyMessage" class="empty hidden">
    <div class="empty-icon">🍽️</div>
    <strong>검색 결과가 없습니다</strong>
  </div>

  <footer>직접 먹어보고 하나씩 기록하는 맛집 리스트 😎</footer>

</main>
  
<div id="imageModal" class="image-modal">
  <span class="image-close">×</span>
  <img id="modalImage" src="" alt="">
</div>

<script src="data.js"></script>

<script>
const categoryIcons = {
  "밥집": "🍚",
  "고기": "🥩",
  "해산물": "🐟",
  "술집": "🍺",
  "카페": "☕",
  "기타": "🍴"
};
  
let selectedCategory = "전체";

/* data.js 읽기 */
const restaurants = window.rawMenus
  .trim()
  .split("\n")
  .map(line => line.trim())
  .filter(Boolean)
  .map(line => {
    const [id, category, name, menu, map, comment = ""] = line.split("|");
    return {
      id: id.trim(),
      category: category.trim(),
      name: name.trim(),
      menu: menu.trim(),
      map: map.trim(),
      comment: comment.trim()
    };
  });

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getIcon(category) {
  return categoryIcons[category] || "🍴";
}

/* 카테고리 버튼 자동 생성 */
function createCategories() {
  const container = document.getElementById("categories");
  const categories = ["전체", ...new Set(restaurants.map(item => item.category))];

  categories.forEach(category => {
    const button = document.createElement("button");
    button.className = "category-button";
    button.textContent = category === "전체" ? "전체" : `${getIcon(category)} ${category}`;

    if (category === "전체") button.classList.add("active");

    button.addEventListener("click", () => {
      selectedCategory = category;
      document.querySelectorAll(".category-button").forEach(btn => btn.classList.remove("active"));
      button.classList.add("active");
      renderRestaurants();
    });

    container.appendChild(button);
  });
}

/* 음식 사진 */
function createImage(item) {
  const box = document.createElement("div");
  box.className = "image-box";

  const img = document.createElement("img");
  img.src = `img/${item.id}.jpg`;
  img.alt = `${item.name} ${item.menu}`;
  img.loading = "lazy";

  img.onerror = () => {
    box.innerHTML = `
      <div class="image-fallback">
        <div>
          <span>${getIcon(item.category)}</span>
          <small>사진 준비중</small>
        </div>
      </div>
    `;
  };

  box.appendChild(img);
  return box;
}

/* 맛집 카드 */
function createCard(item) {
  const card = document.createElement("article");
  card.className = "restaurant-card";

  const image = createImage(item);
  const content = document.createElement("div");
  content.className = "card-content";

  const name = escapeHTML(item.name);
  const menu = escapeHTML(item.menu);
  const category = escapeHTML(item.category);
  const comment = escapeHTML(item.comment);

  content.innerHTML = `
    <div>
      <span class="category-badge">${getIcon(item.category)} ${category}</span>

      <h2 class="restaurant-name">${name}</h2>

      <div class="menu-title">
        <span class="main-label">⭐ 대표메뉴</span>
        ${menu}
      </div>

      ${item.comment ? `
        <div class="comment">
          <span class="quote">“</span>${comment}
        </div>
      ` : ""}
    </div>

    <div class="card-bottom">
      <a href="${item.map}" target="_blank" rel="noopener noreferrer" class="naver-button">
        <span class="naver-n">N</span>
        네이버 지도
      </a>
    </div>
  `;

  card.appendChild(image);
  card.appendChild(content);

  return card;
}

/* 검색 + 카테고리 + 출력 */
function renderRestaurants() {
  const container = document.getElementById("restaurantList");
  const keyword = document.getElementById("searchInput").value.trim().toLowerCase();

  const filtered = restaurants
    .filter(item => {
      const categoryOK = selectedCategory === "전체" || item.category === selectedCategory;
      const searchText = `${item.name} ${item.menu} ${item.comment} ${item.category}`.toLowerCase();
      return categoryOK && (!keyword || searchText.includes(keyword));
    })
    .sort((a, b) => Number(b.id) - Number(a.id));

  container.innerHTML = "";
  filtered.forEach(item => container.appendChild(createCard(item)));

  document.getElementById("resultCount").textContent = `맛집 ${filtered.length}곳`;
  document.getElementById("emptyMessage").classList.toggle("hidden", filtered.length > 0);
}

document.getElementById("searchInput").addEventListener("input", renderRestaurants);
document.getElementById("lastUpdate").textContent = `업데이트 ${window.lastUpdate}`;

createCategories();
renderRestaurants();

const imageModal = document.getElementById("imageModal");
const modalImage = document.getElementById("modalImage");

document.addEventListener("click", e => {

  // 음식 사진 클릭
  if (e.target.matches(".image-box img")) {
    modalImage.src = e.target.src;
    imageModal.classList.add("show");
    document.body.classList.add("modal-open");
  }

  // 검은 배경 또는 X 클릭
  if (
    e.target === imageModal ||
    e.target.classList.contains("image-close")
  ) {
    imageModal.classList.remove("show");
    document.body.classList.remove("modal-open");
    modalImage.src = "";
  }

});

</script>
<!-- 사진 확대 -->

</body>
</html>
